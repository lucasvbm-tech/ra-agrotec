name: Atualizar embargos estaduais de Goiás
on:
  schedule:
    - cron: '17 9 * * 1'   # toda segunda, 06:17 (Brasília)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install shapely
      - run: python scripts/atualizar_embargos_go.py
      - name: Publicar se mudou
        run: |
          git config user.name "R.A AgroTec"
          git config user.email "raagrotec@users.noreply.github.com"
          git add emb_go
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Atualiza embargos estaduais de Goiás (SIGA-GO)"
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
